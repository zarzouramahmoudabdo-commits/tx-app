name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk TX.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TX-apk
          path: TX.apk
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TX.apk --title "TX" --notes "آخر نسخة من التطبيق"
